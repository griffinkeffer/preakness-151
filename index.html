<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Preakness 151 · The Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #f4ecd8;
    --paper-edge: #e8dfc7;
    --gold: #f5c518;
    --gold-deep: #c89b14;
    --rule: rgba(244,236,216,0.1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Cormorant Garamond', Georgia, serif;
    overscroll-behavior-y: contain;
    overflow-x: hidden;
  }

  body {
    min-height: 100svh;
    background:
      radial-gradient(ellipse at 50% 0%, #1a1a1a 0%, #0a0a0a 60%),
      var(--ink);
    background-attachment: fixed;
  }

  /* ============ HEADER ============ */
  .masthead {
    padding: 28px 24px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(245, 197, 24, 0.15);
    position: relative;
  }

  .masthead::before {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    height: 1px;
    width: 80px;
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold);
  }

  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .kicker .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    margin: 0 8px;
    vertical-align: middle;
  }

  .wordmark {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    letter-spacing: 0.04em;
    line-height: 0.9;
    color: var(--paper);
    margin: 0;
  }

  .wordmark .ord {
    color: var(--gold);
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 0.55em;
    vertical-align: super;
    letter-spacing: 0;
    margin-left: 4px;
  }

  .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(244, 236, 216, 0.6);
    margin-top: 6px;
  }

  /* ============ NAV STRIP ============ */
  .strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 16px 24px 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .strip::-webkit-scrollbar { display: none; }

  .pill {
    flex: 0 0 auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 10px;
    border: 1px solid rgba(245, 197, 24, 0.25);
    border-radius: 999px;
    color: rgba(244, 236, 216, 0.7);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pill.active {
    background: var(--silk);
    border-color: var(--silk);
  }
  .pill.active.light-silk { color: #0a0a0a; }
  .pill.active.dark-silk { color: #fff; }

  /* ============ CAROUSEL ============ */
  .carousel-wrap {
    position: relative;
    padding: 24px 0 8px;
  }

  .carousel {
    display: flex;
    gap: 18px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-padding: 0 32px;
    padding: 8px 32px 32px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .carousel::-webkit-scrollbar { display: none; }

  /* ============ CARD ============ */
  .card {
    flex: 0 0 calc(100vw - 80px);
    max-width: 340px;
    scroll-snap-align: center;
    border-radius: 14px;
    overflow: hidden;
    background: #1a1a1a;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 10px 20px -10px rgba(0,0,0,0.5);
  }

  .card-photo {
    aspect-ratio: 16 / 10;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #2d2418, #1a1a1a);
  }

  .card-photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-photo svg {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    height: auto;
    opacity: 0.7;
  }

  .card-photo .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }

  .pp-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-family: 'Bebas Neue', sans-serif;
    background: var(--gold);
    color: var(--ink);
    padding: 5px 9px 3px;
    font-size: 20px;
    letter-spacing: 0.05em;
    line-height: 1;
    border-radius: 3px;
    z-index: 2;
  }
  .pp-badge small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    letter-spacing: 0.2em;
    margin-bottom: 2px;
    font-weight: 700;
  }

  .odds-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--paper);
    line-height: 1;
    text-align: right;
    z-index: 2;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .odds-badge small {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    letter-spacing: 0.2em;
    margin-bottom: 2px;
    color: var(--gold);
  }

  .card-body {
    padding: 16px 18px 20px;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 0.03em;
    line-height: 1;
    margin: 0 0 4px;
    color: var(--paper);
  }

  .card-tag {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(244, 236, 216, 0.5);
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .card-odds {
    font-family: 'Bebas Neue', sans-serif;
    font-style: normal;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.04em;
  }

  .card-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 236, 216, 0.4);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--paper);
  }

  .stat-full {
    grid-column: 1 / -1;
  }

  .stat-peak {
    font-style: italic;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
    color: rgba(244, 236, 216, 0.75);
  }

  .record-strip {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-around;
    font-family: 'Bebas Neue', sans-serif;
  }
  .record-strip .r {
    text-align: center;
  }
  .record-strip .r .v {
    font-size: 18px;
    line-height: 1;
    color: var(--paper);
  }
  .record-strip .r .l {
    font-family: 'JetBrains Mono', monospace;
    font-size: 7px;
    letter-spacing: 0.2em;
    color: rgba(244, 236, 216, 0.4);
    margin-top: 3px;
  }

  /* ============ PICK BANNER ============ */
  .pick-banner {
    text-align: center;
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(245, 197, 24, 0.1);
  }

  .countdown {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--gold);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .pick-input {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    padding: 8px 14px;
    border: 1px solid rgba(245, 197, 24, 0.3);
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: var(--paper);
    outline: none;
    transition: border-color 0.2s;
  }
  .pick-input:focus {
    border-color: var(--gold);
  }
  .pick-input::placeholder {
    color: rgba(244, 236, 216, 0.35);
  }

  .pick-confirmed {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--paper);
    font-style: italic;
  }
  .pick-confirmed strong {
    color: var(--gold);
    font-style: normal;
  }

  /* ============ BACK BUTTON ON CARDS ============ */
  .back-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 9px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.06em;
    background: rgba(255,255,255,0.06);
    color: var(--gold);
    border: 1px solid rgba(245, 197, 24, 0.3);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .back-btn:hover {
    border-color: var(--gold);
    background: rgba(245, 197, 24, 0.08);
  }
  .back-btn:active { background: rgba(245, 197, 24, 0.15); }
  .back-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .back-form {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .back-form .pick-input {
    flex: 1;
    font-size: 14px;
    padding: 8px 12px;
  }

  .back-confirm {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 0.04em;
    padding: 8px 16px;
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .card.picked {
    box-shadow:
      0 0 0 2px var(--gold),
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 10px 20px -10px rgba(0,0,0,0.5);
  }

  /* ============ BACKED BY (post-deadline) ============ */
  .card-picks {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--rule);
  }

  .picks-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 236, 216, 0.4);
    display: block;
    margin-bottom: 4px;
  }

  .picks-names {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--gold);
    font-weight: 600;
  }

  /* ============ FOOTER ============ */
  .footer {
    text-align: center;
    padding: 32px 24px 48px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: rgba(244, 236, 216, 0.35);
    text-transform: uppercase;
  }
  .footer .ornament {
    color: var(--gold);
    margin: 0 6px;
  }

  @media (min-width: 640px) {
    .card { flex: 0 0 360px; }
    .wordmark { font-size: 56px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="kicker">May 17 <span class="dot"></span> Laurel Park <span class="dot"></span> 7:01 PM ET</div>
  <h1 class="wordmark">PREAKNESS<span class="ord">151</span></h1>
  <div class="sub">The 151<sup>st</sup> Run for the Black-Eyed Susans · The Field</div>
</header>

<div class="pick-banner" id="pick-banner">
  <div class="countdown" id="countdown"></div>
  <div class="pick-confirmed" id="pick-confirmed" hidden></div>
</div>

<nav class="strip" id="strip" aria-label="Post position jump"></nav>

<div class="carousel-wrap">
  <div class="carousel" id="carousel"></div>
</div>

<footer class="footer">
  <span class="ornament">&#10038;</span> Swipe to browse the field <span class="ornament">&#10038;</span>
</footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="horse-silhouette" viewBox="0 0 400 220">
      <g fill="#1a1410">
        <path d="M70 130 Q90 95 145 92 Q200 88 245 95 Q285 100 305 115 L325 110 Q335 108 338 118 Q340 130 325 138 L310 142 Q300 160 285 165 L275 200 Q272 212 262 212 L252 212 Q244 212 246 200 L252 168 L200 168 L195 200 Q193 212 183 212 L173 212 Q165 212 167 200 L172 165 Q140 162 110 150 Q90 142 80 138 Z"/>
        <path d="M295 115 Q315 80 340 60 Q355 48 368 52 Q378 55 376 68 Q373 80 360 88 L355 100 Q360 105 358 110 Q355 115 348 113 L342 118 Q340 122 332 120 L320 122 Z"/>
        <path d="M348 56 L352 42 L358 50 Z"/>
        <path d="M295 115 Q300 95 320 88 Q310 100 305 118 Z" fill="#0a0a0a"/>
        <path d="M75 130 Q50 135 35 155 Q42 152 55 148 Q48 165 38 178 Q55 168 70 158 Q60 175 55 185 Q72 170 82 158 Z" fill="#0a0a0a"/>
        <rect x="186" y="165" width="8" height="48" rx="2"/>
        <rect x="262" y="165" width="8" height="48" rx="2"/>
        <path d="M170 168 Q150 180 130 200 L138 205 Q160 188 178 175 Z"/>
        <path d="M250 170 Q240 195 232 210 L240 212 Q252 198 260 178 Z"/>
        <rect x="184" y="208" width="12" height="4" fill="#000"/>
        <rect x="260" y="208" width="12" height="4" fill="#000"/>
        <circle cx="358" cy="74" r="1.6" fill="#f5c518"/>
      </g>
      <g transform="translate(180,55)">
        <ellipse cx="40" cy="35" rx="36" ry="22" fill="#c8102e"/>
        <ellipse cx="22" cy="20" rx="14" ry="13" fill="#1a1410"/>
        <path d="M14 18 Q22 8 32 14 L30 22 Q22 18 14 22 Z" fill="#f5c518"/>
        <rect x="20" y="32" width="10" height="14" fill="#f5c518"/>
      </g>
    </symbol>
  </defs>
</svg>

<script>
const FIELD = [
  { pp: 1, name: "Taj Mahal", slug: "taj-mahal", odds: "5-1", trainer: "Brittany Russell", jockey: "Sheldon Russell", style: "Pacesetter", styleDesc: "Wants the lead.", record: "3-3-0-0", silk: "#cc0000", numColor: "#fff", peak: "Undefeated and already 3-for-3 at Laurel Park, making him the only proven local specialist in this field." },
  { pp: 2, name: "Ocelli", slug: "ocelli", odds: "6-1", trainer: "Whit Beckman", jockey: "Tyler Gaffalione", style: "Closer", styleDesc: "Rallies from far back.", record: "7-0-1-4", silk: "#ffffff", numColor: "#000", peak: "Still a maiden after seven starts, yet he nearly stole the Kentucky Derby stretch battle and finished third at 70-1." },
  { pp: 3, name: "Crupper", slug: "crupper", odds: "30-1", trainer: "Donnie Von Hemel", jockey: "Junior Alvarado", style: "Presser", styleDesc: "Sits just off the lead.", record: "6-2-0-3", silk: "#0000cc", numColor: "#fff", peak: "Needed four starts to break his maiden, so this graded-stakes debut is a big jump in class." },
  { pp: 4, name: "Robusta", slug: "robusta", odds: "30-1", trainer: "Doug O'Neill", jockey: "Rafael Bejarano", style: "Presser", styleDesc: "Sits just off the lead.", record: "6-1-1-0", silk: "#ffee00", numColor: "#000", peak: "Best career result is a runner-up finish in the San Felipe Stakes at 68-1, so he has already outrun massive odds once." },
  { pp: 5, name: "Talkin", slug: "talkin", odds: "20-1", trainer: "Danny Gargan", jockey: "Irad Ortiz Jr.", style: "Stalker", styleDesc: "Sits mid-pack, angles out late.", record: "5-1-1-1", silk: "#008000", numColor: "#fff", peak: "0-for-4 in graded stakes and has been beaten a combined 41½ lengths in those tries, despite picking up Irad Ortiz Jr. here." },
  { pp: 6, name: "Chip Honcho", slug: "chip-honcho", odds: "5-1", trainer: "Steve Asmussen", jockey: "Jose Ortiz", style: "Presser", styleDesc: "Sits just off the lead.", record: "6-2-2-0", silk: "#000000", numColor: "#ffee00", peak: "Does his best work near the front, but in each of his three starts this year he lost ground in the stretch." },
  { pp: 7, name: "The Hell We Did", slug: "the-hell-we-did", odds: "15-1", trainer: "Todd Fincher", jockey: "Luis Saez", style: "Stalker", styleDesc: "Sits mid-pack, angles out late.", record: "4-2-2-0", silk: "#ff6600", numColor: "#000", peak: "Was 2-for-3 sprinting before stretching out and finishing second in the Lexington Stakes in his two-turn debut." },
  { pp: 8, name: "Bull by the Horns", slug: "bull-by-the-horns", odds: "30-1", trainer: "Saffie Joseph Jr.", jockey: "Micah Husbands", style: "Closer", styleDesc: "Rallies from far back.", record: "5-2-0-2", silk: "#ff69b4", numColor: "#000", peak: "Trained by Saffie Joseph Jr., but his only graded-stakes try ended in a seventh-place finish beaten 19 lengths." },
  { pp: 9, name: "Iron Honor", slug: "iron-honor", odds: "9-2", trainer: "Chad Brown", jockey: "Flavien Prat", style: "Presser", styleDesc: "Sits just off the lead.", record: "3-2-0-0", silk: "#00cccc", numColor: "#000", peak: "Won his first two starts and is trained by Chad Brown, who had already won the Preakness twice entering this race." },
  { pp: 10, name: "Napoleon Solo", slug: "napoleon-solo", odds: "8-1", trainer: "Chad Summers", jockey: "Paco Lopez", style: "Pacesetter", styleDesc: "Wants the lead.", record: "4-2-0-0", silk: "#660099", numColor: "#fff", peak: "A perfect 2-for-2 at age two, including a Champagne Stakes win, but he has looked less effective in longer two-turn races this year." },
  { pp: 11, name: "Corona de Oro", slug: "corona-de-oro", odds: "30-1", trainer: "Dallas Stewart", jockey: "John Velazquez", style: "Pacesetter", styleDesc: "Wants the lead.", record: "5-1-1-2", silk: "#999999", numColor: "#cc0000", peak: "Only win in five starts came wire-to-wire in moderate fractions, which makes this pace setup much tougher for him." },
  { pp: 12, name: "Incredibolt", slug: "incredibolt", odds: "5-1", trainer: "Riley Mott", jockey: "Jaime Torres", style: "Stalker", styleDesc: "Sits mid-pack, angles out late.", record: "6-3-0-0", silk: "#66cc00", numColor: "#000", peak: "Owns the field's best late-pace numbers and is the only horse in this lineup with a graded-stakes win around two turns." },
  { pp: 13, name: "Great White", slug: "great-white", odds: "15-1", trainer: "John Ennis", jockey: "Alex Achard", style: "Pacesetter", styleDesc: "Wants the lead.", record: "4-2-0-0", silk: "#663300", numColor: "#fff", peak: "Was scratched at the Kentucky Derby gate after rearing up and falling, though fortunately neither he nor his rider were seriously injured." },
  { pp: 14, name: "Pretty Boy Miah", slug: "pretty-boy-miah", odds: "15-1", trainer: "Jeremiah Englehart", jockey: "Ricardo Santana Jr.", style: "Pacesetter", styleDesc: "Wants the lead.", record: "4-2-1-0", silk: "#800000", numColor: "#ffee00", peak: "Has never raced beyond a mile, so the big question is whether his obvious sprint speed can stretch that far." },
];

const carousel = document.getElementById('carousel');
const strip = document.getElementById('strip');

function shade(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = Math.max(0, Math.min(255, (num >> 16) + percent));
  let g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + percent));
  let b = Math.max(0, Math.min(255, (num & 0xFF) + percent));
  return '#' + ((r<<16) | (g<<8) | b).toString(16).padStart(6, '0');
}

FIELD.forEach((h, idx) => {
  const pill = document.createElement('button');
  const isLight = ['#ffffff','#ffee00','#ff69b4','#00cccc','#ff6600','#999999','#66cc00'].includes(h.silk);
  pill.className = 'pill' + (idx === 0 ? ' active' : '') + (isLight ? ' light-silk' : ' dark-silk');
  pill.textContent = h.pp;
  pill.dataset.idx = idx;
  pill.style.setProperty('--silk', h.silk);
  pill.addEventListener('click', () => {
    document.querySelectorAll('.card')[idx].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
  strip.appendChild(pill);

  const hasPic = !!h.slug;
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.idx = idx;

  const photoContent = hasPic
    ? `<img src="${h.slug}-race.jpg" alt="${h.name}" style="object-position: ${h.focus || 'center'}"><div class="gradient"></div>`
    : `<svg><use href="#horse-silhouette"/></svg><div class="gradient"></div>`;

  const photoBg = hasPic ? '' : `style="background: linear-gradient(135deg, ${shade(h.silk, 20)}, ${shade(h.silk, -30)})"`;

  card.innerHTML = `
    <div class="card-photo" ${photoBg}>
      <div class="pp-badge" style="background:${h.silk};color:${h.numColor};"><small>POST</small>${h.pp}</div>
      ${photoContent}
    </div>
    <div class="card-body">
      <h2 class="card-name">${h.name}</h2>
      <div class="card-tag"><span>${h.style} · ${h.styleDesc}</span><span class="card-odds">${h.odds}</span></div>
      <div class="record-strip">
        <div class="r"><div class="v">${h.record.split('-')[0]}</div><div class="l">Starts</div></div>
        <div class="r"><div class="v">${h.record.split('-')[1]}</div><div class="l">Wins</div></div>
        <div class="r"><div class="v">${h.record.split('-')[2]}</div><div class="l">Place</div></div>
        <div class="r"><div class="v">${h.record.split('-')[3]}</div><div class="l">Show</div></div>
      </div>
      <div class="card-stats">
        <div class="stat"><span class="stat-label">Jockey</span><span class="stat-value">${h.jockey}</span></div>
        <div class="stat"><span class="stat-label">Trainer</span><span class="stat-value">${h.trainer}</span></div>
        <div class="stat stat-full"><span class="stat-label">Paddock Peak</span><span class="stat-value stat-peak">${h.peak}</span></div>
      </div>
      <button class="back-btn" data-horse="${h.slug}" data-name="${h.name}">Back ${h.name}</button>
      <div class="back-form" hidden>
        <input type="text" class="pick-input" maxlength="30" placeholder="Your name">
        <button class="back-confirm" data-horse="${h.slug}">Confirm</button>
      </div>
      <div class="card-picks" hidden></div>
    </div>
  `;
  carousel.appendChild(card);
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const idx = +e.target.dataset.idx;
      document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', +p.dataset.idx === idx));
    }
  });
}, { root: carousel, threshold: 0.7 });
document.querySelectorAll('.card').forEach(c => observer.observe(c));

// ============ PICKS SYSTEM ============
const DEADLINE_MS = new Date('2026-05-17T22:40:00Z').getTime();
const STORAGE_KEY = 'preakness151-pick';
const countdownEl = document.getElementById('countdown');
const pickConfirmed = document.getElementById('pick-confirmed');

function isClosed() { return Date.now() >= DEADLINE_MS; }

function getStoredPick() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch { return null; }
}

function updateCountdown() {
  const diff = DEADLINE_MS - Date.now();
  if (diff <= 0) {
    countdownEl.textContent = 'Picks are closed';
    document.querySelectorAll('.back-btn').forEach(b => b.hidden = true);
    document.querySelectorAll('.back-form').forEach(f => f.hidden = true);
    clearInterval(timerInterval);
    loadPicks();
    return;
  }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  countdownEl.textContent = `Picks close in ${h}h ${m}m ${s}s`;
}

const timerInterval = setInterval(updateCountdown, 1000);
updateCountdown();

// Back button: show name input inline
document.querySelectorAll('.back-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.back-form').forEach(f => f.hidden = true);
    document.querySelectorAll('.back-btn').forEach(b => b.hidden = false);
    btn.hidden = true;
    const form = btn.nextElementSibling;
    form.hidden = false;
    form.querySelector('.pick-input').focus();
  });
});

// Confirm button: submit the pick
document.querySelectorAll('.back-confirm').forEach(btn => {
  btn.addEventListener('click', async () => {
    const form = btn.parentElement;
    const nameInput = form.querySelector('.pick-input');
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    const horse = btn.dataset.horse;
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, horse })
      });
      const data = await res.json();
      if (data.ok) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, horse }));
        showPickedState(horse);
      } else {
        btn.textContent = data.error || 'Error';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Confirm'; }, 2000);
      }
    } catch (err) {
      btn.textContent = 'Error';
      btn.disabled = false;
      setTimeout(() => { btn.textContent = 'Confirm'; }, 2000);
    }
  });
});

// Allow Enter key to submit from name input
document.querySelectorAll('.back-form .pick-input').forEach(input => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.parentElement.querySelector('.back-confirm').click();
  });
});

function showPickedState(horseSlug) {
  const horse = FIELD.find(f => f.slug === horseSlug);
  pickConfirmed.innerHTML = `You backed <strong>${horse.name}</strong>`;
  pickConfirmed.hidden = false;
  document.querySelectorAll('.back-btn').forEach(b => b.hidden = true);
  document.querySelectorAll('.back-form').forEach(f => f.hidden = true);
  const cards = document.querySelectorAll('.card');
  const idx = FIELD.findIndex(f => f.slug === horseSlug);
  if (idx >= 0) cards[idx].classList.add('picked');
}

async function loadPicks() {
  try {
    const res = await fetch('/api/picks');
    const { picks } = await res.json();
    const grouped = {};
    for (const [name, slug] of Object.entries(picks)) {
      if (!grouped[slug]) grouped[slug] = [];
      grouped[slug].push(name);
    }
    document.querySelectorAll('.card').forEach((card, idx) => {
      const h = FIELD[idx];
      const picksDiv = card.querySelector('.card-picks');
      const names = grouped[h.slug];
      if (names && names.length) {
        picksDiv.innerHTML = `<span class="picks-label">Backed By</span><span class="picks-names">${names.join(', ')}</span>`;
        picksDiv.hidden = false;
      }
    });
  } catch (err) {}
}

// On page load: check stored pick or load picks if closed
const stored = getStoredPick();
if (stored) {
  showPickedState(stored.horse);
} else if (isClosed()) {
  document.querySelectorAll('.back-btn').forEach(b => b.hidden = true);
  loadPicks();
}
</script>

</body>
</html>
